[package]
name = "lmbench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
aws-config = { version = "1.13.0", optional = true }
aws-sdk-bedrock = { version = "1.166.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-bedrockruntime = { version = "1.153.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
harmony-protocol = { version = "0.1.0", optional = true }
indicatif = { version = "0.18.6", features = ["tokio"] }
indoc = "2.0.8"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
jaq-core = "3.1.2"
lazy_static = "1.5.1"
parking_lot = "0.13"
rand = "0.10.3"
rand_distr = "0.6.0"
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.24.0"
tokenizers = { version = "0.23.2", features = ["http"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = { version = "0.1.44", features = ["valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "valuable"] }
tracing-appender = "0.2.5"

[lib]
name = "lmbench"
path = "src/lib.rs"

[[bin]]
name = "lmbench"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2"
httpmock = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[features]
default = []
bedrock = ["dep:aws-config", "dep:aws-sdk-bedrock", "dep:aws-sdk-bedrockruntime"]
harmony = ["dep:harmony-protocol"]
